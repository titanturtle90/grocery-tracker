<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div class="brand-text">
        <div class="brand-name">Grocery Glance</div>
        <div class="brand-sub" id="syncStatus"><span class="dot"></span><span class="txt">Connecting…</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="notifyBtn" type="button" title="Enable expiry alerts" hidden><svg class="ic"><use href="#i-bell"/></svg></button>
    </div>
  </header>

  <main>
    <!-- ============ KITCHEN ============ -->
    <section id="panel-kitchen" class="panel" data-panel="kitchen">
      <div class="page-head">
        <div><h1>Kitchen</h1><p class="lede" id="kitchenLede">What you have, and what to eat first.</p></div>
        <div class="head-actions"><button class="btn sm ghost" id="kitchenSelectBtn" type="button">Select</button></div>
      </div>
      <div class="stats" id="stats">
        <button class="stat expired" data-urgency="expired" type="button"><div class="n" id="countExpired">0</div><div class="l">Expired</div></button>
        <button class="stat today" data-urgency="today" type="button"><div class="n" id="countToday">0</div><div class="l">Today</div></button>
        <button class="stat soon" data-urgency="soon" type="button"><div class="n" id="countSoon">0</div><div class="l">Soon</div></button>
        <button class="stat fresh" data-urgency="fresh" type="button"><div class="n" id="countFresh">0</div><div class="l">Fresh</div></button>
      </div>
      <div id="kitchenUseUp" class="mt-12" hidden></div>
      <div class="search mt-12">
        <svg class="ic"><use href="#i-search"/></svg>
        <input type="search" id="kitchenSearch" placeholder="Search your kitchen" autocomplete="off">
        <button class="icon-btn sm plain clear" type="button" aria-label="Clear"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="chips scroll mt-8" id="kitchenFilters"></div>
      <div id="kitchenList" class="mt-8"></div>
    </section>

    <!-- ============ SHOPPING ============ -->
    <section id="panel-shopping" class="panel" data-panel="shopping" hidden>
      <div class="page-head">
        <div><h1>Shopping</h1><p class="lede" id="shopLede">Grouped by where it is in the store.</p></div>
        <div class="head-actions">
          <button class="btn sm ghost" id="shopSelectBtn" type="button">Select</button>
          <button class="icon-btn" id="shopMoreBtn" type="button" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
        </div>
      </div>
      <form id="shopForm" class="row">
        <div class="search grow">
          <svg class="ic"><use href="#i-plus"/></svg>
          <input type="text" id="shopName" placeholder="Add something to buy…" autocomplete="off" required>
        </div>
        <input type="text" class="input" id="shopQty" placeholder="Qty" style="width:74px; flex-shrink:0;">
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div id="shopList" class="mt-12"></div>
    </section>

    <!-- ============ BOGO ============ -->
    <section id="panel-bogo" class="panel" data-panel="bogo" hidden>
      <div class="page-head">
        <div><h1>Publix BOGOs</h1><p class="lede" id="bogoLede">Buy one, get one free — refreshed every Thursday.</p></div>
        <div class="head-actions"><button class="icon-btn" id="bogoMoreBtn" type="button" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button></div>
      </div>
      <div id="bogoHero"></div>
      <div class="search mt-12">
        <svg class="ic"><use href="#i-search"/></svg>
        <input type="search" id="bogoSearch" placeholder="Search this week's deals" autocomplete="off">
        <button class="icon-btn sm plain clear" type="button" aria-label="Clear"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="chips scroll mt-8" id="bogoCats"></div>
      <div id="bogoRecipes"></div>
      <div id="bogoList" class="mt-8"></div>
    </section>

    <!-- ============ RECIPES ============ -->
    <section id="panel-recipes" class="panel" data-panel="recipes" hidden>
      <div id="recipesRoot"></div>
    </section>
  </main>
</div>

<button class="fab" id="fab" type="button" aria-label="Add grocery"><svg class="ic"><use href="#i-plus"/></svg></button>

<nav class="tabbar" aria-label="Main">
  <div class="inner">
    <button class="tab active" data-tab="kitchen" type="button"><span class="ico"><svg class="ic"><use href="#i-kitchen"/></svg><span class="badge" id="badgeKitchen" hidden></span></span>Kitchen</button>
    <button class="tab" data-tab="shopping" type="button"><span class="ico"><svg class="ic"><use href="#i-cart"/></svg><span class="badge accent" id="badgeShopping" hidden></span></span>Shopping</button>
    <button class="tab" data-tab="bogo" type="button"><span class="ico"><svg class="ic"><use href="#i-tag"/></svg><span class="badge accent" id="badgeBogo" hidden></span></span>BOGOs</button>
    <button class="tab" data-tab="recipes" type="button"><span class="ico"><svg class="ic"><use href="#i-chef"/></svg></span>Recipes</button>
  </div>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot" hidden></div>
</div>

<div class="dialog" id="dialog" role="alertdialog">
  <div class="box">
    <h3 id="dialogTitle"></h3>
    <p id="dialogText"></p>
    <div class="btns"><button class="btn" id="dialogCancel" type="button">Cancel</button><button class="btn primary" id="dialogOk" type="button">OK</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button class="act" id="toastAct" type="button" hidden></button></div>
